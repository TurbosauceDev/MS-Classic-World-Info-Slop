# Windows build of the grind tracker (tracker/). Push a tag like tracker-v0.1.0 (same as tracker/package.json "version")
# to publish a GitHub Release (or run it by hand with "release" ticked); installed copies update themselves from the latest
# release. Other runs only build.
name: tracker
on:
  push:
    tags: ["tracker-v*"]
    branches: ["main"]   # test builds while the tracker is in progress
    paths: ["tracker/**", ".github/workflows/tracker.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release (installed copies update to it)"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults: { run: { working-directory: tracker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run data
      - run: npm test
      - run: npm run ${{ (startsWith(github.ref, 'refs/tags/') || inputs.release) && 'release' || 'dist' }}
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      # electron-publish 25.1.8 creates the release with no body (createRelease() never sends one),
      # so the notes that npm run release generated from changelog.js are put on the release here
      - if: startsWith(github.ref, 'refs/tags/') || inputs.release == true
        run: node scripts/publish-release-notes.js
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/upload-artifact@v4
        with: { name: installer, path: tracker/dist/*.exe }
  # the window's own tests in Chromium (Electron's host stubbed): every tab, the box layout and window resizing
  ui:
    runs-on: ubuntu-24.04   # not -latest: it became 26.04, which Playwright 1.56.1 refuses (2026-10-31)
    defaults: { run: { working-directory: tracker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save --ignore-scripts playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: npm run data
      - run: node tests/ui.test.js
      - run: node tests/layout.test.js
      - run: node tests/extras.test.js
      - run: node tests/journal-ui.test.js
      - run: node tests/focus.test.js
      - run: node tests/overlay.test.js
      - run: node tests/overlaywin.test.js
      - run: node tests/monkey.test.js
