# Windows build of the grind tracker (tracker/). Push a tag like tracker-v0.1.0 (same as tracker/package.json "version")
# to publish a GitHub Release; installed copies update themselves from the latest release. Manual runs only build.
name: tracker
on:
  push:
    tags: ["tracker-v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults: { run: { working-directory: tracker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run data
      - run: npm test
      - run: npm run ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'dist' }}
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/upload-artifact@v4
        with: { name: installer, path: tracker/dist/*.exe }
