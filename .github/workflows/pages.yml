# GitHub Pages: serve the built page at the site root (no /dist/ in the URL). Needs Settings > Pages > Source = "GitHub Actions"
# (until then Pages keeps building from the branch, where the root index.html forwards to dist/). Old .../dist/ links get a
# small page that forwards to the root, keeping the #share part.
name: pages
on:
  push:
    branches: ["main"]
    paths: ["dist/index.html", "data/data.json", "src/**", "scripts/build.py", "tracker/app/**", "src/pwa/**", "scripts/pages_site.py", ".github/workflows/pages.yml"]
  workflow_run:   # the daily shared-data + per-update meso.watch commits are pushed with GITHUB_TOKEN, which doesn't trigger push workflows
    workflows: ["shared-data", "meso.watch poll", "classicmarket poll", "meowdb market poll", "shopscans poll", "mesoindex poll"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: { name: github-pages, url: "${{ steps.dep.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      # smoke test before every deploy: bot price commits never trigger Site tests, and 10-21 a red main deployed 4 times
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      # the price polls commit only data (2026-10-21: a 7 MB page per poll was most of the repo's growth): build it here
      - run: python3 scripts/build.py | tail -2
      - run: node tests/smoke.js | tail -25
        shell: bash -o pipefail {0}
      - name: Assemble site
        run: |
          mkdir -p site/dist
          # page minus item icons/minimaps (fetched after start) + manifest, icons, offline service worker
          python3 scripts/pages_site.py site
          cat > site/dist/index.html <<'EOF'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><title>MS Classic World Data Slop</title>
          <meta http-equiv="refresh" content="0; url=../"><script>location.replace("../" + location.hash)</script></head>
          <body><p>Moved: <a href="../">open the planner</a></p></body></html>
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: dep
        uses: actions/deploy-pages@v4

