# GitHub Pages: serve the built page at the site root (no /dist/ in the URL). Needs Settings > Pages > Source = "GitHub Actions"
# (until then Pages keeps building from the branch, where the root index.html forwards to dist/). Old .../dist/ links get a
# small page that forwards to the root, keeping the #share part.
name: pages
on:
  push:
    branches: ["main"]
    paths: ["data/**", "scripts/live_data.py", "src/**", "scripts/build.py", "scripts/canary.py", "tracker/app/**", "tracker/core/**", "src/pwa/**", "scripts/pages_site.py", "scripts/pages_gen.py", ".github/workflows/pages.yml"]
  # price polls push with GITHUB_TOKEN (no push event): instead of one deploy per poll (47/day), a half-hourly run deploys
  # only if data/ changed since the last successful deploy (Danny 2026-11-02: up to 30 min for new prices is fine)
  schedule: [{cron: "14,44 * * * *"}]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# cancel-in-progress: false — a run enters this queue before its gate can skip it: with cancel-in-progress a skipping run
# cancelled a pending push deploy (seen 2026-11-02, meso.watch outage). Queued runs serialize; a no-change run skips in seconds.
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  gate:
    runs-on: ubuntu-24.04
    permissions: { contents: read, actions: read }
    outputs: { go: "${{ steps.g.outputs.go }}" }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 300 }
      - id: g
        env: { GH_TOKEN: "${{ github.token }}", EVENT: "${{ github.event_name }}", REPO: "${{ github.repository }}" }
        run: |
          # pushes and manual runs always deploy; the half-hourly run deploys only when data/ moved since the last good deploy
          go=true
          if [ "$EVENT" = schedule ]; then
            last=$(gh api "repos/$REPO/actions/workflows/pages.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')
            if [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null && git diff --quiet "$last" HEAD -- data/; then go=false; fi
            echo "last good deploy ${last:-none}, data changed since: $go"
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
  deploy:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-24.04   # not -latest: it became 26.04, which Playwright 1.56.1 refuses (2026-10-31)
    timeout-minutes: 15
    environment: { name: github-pages, url: "${{ steps.dep.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      # smoke test before every deploy: bot price commits never trigger Site tests, and 10-21 a red main deployed 4 times
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts --no-audit --no-fund && npx playwright install --with-deps chromium   # versions: root package.json
      # the price polls commit only data (2026-10-21: a 7 MB page per poll was most of the repo's growth): build it here
      - run: python3 scripts/build.py | tail -2
      # golden refs gate the deploy too (Z.ai 10-25: tests.yml catches golden regressions on the NEXT push —
      # too late; 10-21 a red main deployed 4x. ~1s, catches the most common regression before it ships)
      - run: node tests/golden.js | tail -3
        shell: bash -o pipefail {0}
      - run: node tests/smoke.js | tail -25
        shell: bash -o pipefail {0}
      - name: Assemble site
        run: |
          mkdir -p site/dist
          # page minus item icons/minimaps (fetched after start) + manifest, icons, offline service worker
          python3 scripts/pages_site.py site
          cat > site/dist/index.html <<'EOF'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><title>MS Classic World Data Slop</title>
          <meta http-equiv="refresh" content="0; url=../"><script>location.replace("../" + location.hash)</script></head>
          <body><p>Moved: <a href="../">open the planner</a></p></body></html>
          EOF
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: dep
        uses: actions/deploy-pages@v4

