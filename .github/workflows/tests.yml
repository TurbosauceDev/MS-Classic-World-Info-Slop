# Site tests on every push/PR: smoke (every tab, 390px, no page errors) + golden (meowdb reference numbers) + edge
# (bad saved state / share links / server replies, phone layout, keyboard: the 2026-10-19 bug hunt).
# Builds dist/index.html from src + data.json first (the price polls no longer commit it), like pages.yml does.
name: Site tests
on:
  push:
    branches: ["main"]
    paths: ["dist/**", "src/**", "data/**", "tests/**", "tracker/app/readers.js", "tracker/core/**", "scripts/pages_site.py", ".github/workflows/tests.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # the whole suite takes ~12 min; a hung browser would otherwise hold the runner 6 h
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # pinned like tracker.yml: an unpinned install picks up each new Playwright release the day it ships
      - id: install
        run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Cron minutes
        run: node tests/cron.test.js
      - name: Poll cadence
        run: node tests/cadence_test.js
      - run: python3 scripts/build.py | tail -2
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node tests/smoke.js
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node tests/golden.js
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node tests/edge.js
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node tests/features.js
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node tests/pages.js
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node tests/snipe.js
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node tests/craftplan.js
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node tests/kpq.js
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node tests/expclive.js
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node tests/questvalue.js
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node tests/polish.js
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node tests/questlog.js
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python3 tests/deal_life_test.py
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python3 tests/watchdog_test.py
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python3 tests/classicmarket_test.py
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python3 tests/shopscans_test.py
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python3 tests/mesoindex_test.py
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python3 tests/meowdb_test.py
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python3 tests/mesowatch_fresh_test.py
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python3 tests/data_quality_test.py
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node tests/monkey.js
