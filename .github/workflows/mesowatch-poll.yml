# Scheduled meso.watch poller: runs every 30 min, fetches meso.watch via
# agent-browser (headless Chrome passes the Cloudflare check), regenerates
# mesowatch_prices.json, commits to main if anything changed. Pages redeploys
# via pages.yml workflow_run trigger.
#
# Cron schedule: TWO cron entries at off-minute marks (7,37 and 13,43) so
# GitHub's flaky scheduler can skip either one without missing the window.
# GitHub warns 0/30 are high-load marks — never use those. If both fire in
# the same 6-min window, the concurrency block below queues the second
# behind the first (cancel-in-progress: false) so we don't lose a
# half-finished commit.
#
# Uses GITHUB_TOKEN (auto-injected, no PAT needed). Commits as 'meso.watch helper'.
# OSMS data export is cached across runs (keyed on OSMS_REF).

name: meso.watch poll

on:
  schedule:
    - cron: "7,37 * * * *"    # primary — every 30 min at minute 7 and 37
    - cron: "13,43 * * * *"   # fallback — every 30 min at minute 13 and 43
  workflow_dispatch:

permissions:
  contents: write

# If a scheduled run and a manual dispatch overlap, OR if both crons fire
# close together, queue the second behind the first (don't cancel — we'd
# lose a half-finished commit). Workflow runtime is ~60s, so this rarely
# matters, but the queueing is safer than canceling.
concurrency:
  group: mesowatch-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OSMS_REF: c661434d86c0fe2c9baae974d509d3498f97df62
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history for `git show HEAD:<path>` in mesowatch_claude_review.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow (for squash_images.py)
        run: pip install --quiet Pillow

      - name: Install agent-browser + Chrome deps
        run: |
          npm install -g agent-browser
          agent-browser install --with-deps

      - name: Restore OSMS data export cache
        id: osms-cache
        uses: actions/cache@v4
        with:
          path: vendor/osms_datamine_dashboard
          key: osms-${{ env.OSMS_REF }}

      - name: Fetch OSMS data (if cache miss or partial)
        if: steps.osms-cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch_osms.sh

      - name: Run meso.watch poll
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/mesowatch-sync/mesowatch_poll_ci.sh



