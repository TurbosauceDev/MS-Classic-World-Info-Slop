# Scheduled meso.watch poller: runs every 10 min, fetches meso.watch via
# agent-browser (headless Chrome passes the Cloudflare check), regenerates
# mesowatch_prices.json, commits to main if anything changed. Pages redeploys
# via pages.yml workflow_run trigger.
#
# Cron schedule: SIX separate cron entries at off-minute marks (7, 17, 27,
# 37, 47, 57). GitHub's scheduler is flaky and silently skips scheduled
# runs during high-load periods; 6 independent entries per hour give us
# 6 chances to fire. GitHub warns 0/30 are high-load marks — never use
# those. If two entries fire close together, the concurrency block below
# queues the second behind the first (cancel-in-progress: false) so we
# don't lose a half-finished commit.
#
# Why 6 separate entries instead of one '7,17,27,37,47,57 * * * *'? Each
# entry is a separate schedule event in GitHub's scheduler — if one is
# skipped, the others still fire. A comma-separated list is one event;
# if GitHub skips it, all 6 minute marks are skipped.
#
# Uses GITHUB_TOKEN (auto-injected, no PAT needed). Commits as 'meso.watch helper'.
# OSMS data export is cached across runs (keyed on OSMS_REF).
# Step-level timeouts (audit P11): a hung step dies and releases the shared main-pipeline
# lock before the job ceiling, instead of grinding while every other poll queues behind it.

name: meso.watch poll

on:
  schedule:
    - cron: "7 * * * *"
    - cron: "17 * * * *"
    - cron: "27 * * * *"
    - cron: "37 * * * *"
    - cron: "47 * * * *"
    - cron: "57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Shared concurrency group across all workflows that commit to main (poll +
# site builds). Queue instead of cancel so we don't lose a half-finished
# commit on dist/index.html. Workflow runtime is ~60s, so queueing is a
# no-op in practice.
concurrency:
  group: main-pipeline
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OSMS_REF: c661434d86c0fe2c9baae974d509d3498f97df62
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history for `git show HEAD:<path>` in mesowatch_claude_review.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow (for squash_images.py)
        run: pip install --quiet Pillow

      - name: Install agent-browser + Chrome deps
        timeout-minutes: 5
        run: |
          # pinned: this job holds a contents:write token (enough to publish a tracker release that auto-updates players)
          npm install -g agent-browser@0.39.1
          agent-browser install --with-deps

      - name: Restore OSMS data export cache
        id: osms-cache
        uses: actions/cache@v4
        with:
          path: vendor/osms_datamine_dashboard
          key: osms-${{ env.OSMS_REF }}

      - name: Fetch OSMS data (if cache miss or partial)
        if: steps.osms-cache.outputs.cache-hit != 'true'
        timeout-minutes: 6
        run: bash scripts/fetch_osms.sh

      - name: Run meso.watch poll
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/mesowatch-sync/mesowatch_poll_ci.sh





