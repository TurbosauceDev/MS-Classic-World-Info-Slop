# Shared grind data server (server/): Cloudflare Worker + D1. Needs repo secrets CLOUDFLARE_API_TOKEN (Edit Cloudflare
# Workers template + Account D1 Edit) and CLOUDFLARE_ACCOUNT_ID. Creates the database the first time, applies schema.sql
# (CREATE ... IF NOT EXISTS, safe to re-run), deploys. Without the secrets it only runs the tests.
name: server
on:
  push:
    branches: ["main"]
    paths: ["server/**", "tracker/core/kpqscore.js", ".github/workflows/server.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: server } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FEEDBACK_KEY: ${{ secrets.FEEDBACK_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run data
      - run: npm test
      - name: Database
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="ms-classic-runs") | .uuid')
          if [ -z "$id" ]; then npx wrangler d1 create ms-classic-runs; id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="ms-classic-runs") | .uuid'); fi
          sed -i "s/FILLED_IN_BY_DEPLOY/$id/" wrangler.toml
          npx wrangler d1 execute ms-classic-runs --remote --file schema.sql --yes
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
      # the key that opens the site's Feedback inbox (repo secret FEEDBACK_KEY; without it the inbox stays closed)
      - name: Feedback key
        if: env.CLOUDFLARE_API_TOKEN != '' && env.FEEDBACK_KEY != ''
        run: printf '%s' "$FEEDBACK_KEY" | npx wrangler secret put FEEDBACK_KEY
