# Every 3 hours: mesoindex.com prices (/api/catalog) + per-item shop listings (/api/item?game=, only items whose catalog row
# moved) -> data/sources/mesoindex.json + D.mi, commit to main when changed (pages.yml builds the page). Owner OK'd use 2026-10-20.
# A failed fetch exits 0 and commits nothing. No vendor/ needed. Own workflow; same concurrency group as the other polls.
# Step-level timeouts (audit P11): a hung fetch dies and releases the shared lock instead of grinding to the job ceiling.
name: mesoindex poll
on:
  schedule: [{cron: "33 2-23/3 * * *"}]   # off the other polls' minutes and hours (tests/cron.test.js)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: main-pipeline
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - run: python3 tests/mesoindex_test.py
        timeout-minutes: 2
      - name: Fetch, build, commit if changed
        timeout-minutes: 25
        # push races: scripts/ci/commit_push.sh (resets onto the new main, never merges data.json); -u so the run log shows fetch progress live
        run: |
          python3 -u scripts/fetch_mesoindex.py
          [ -f data/sources/mesoindex.json ] || exit 0   # first fetch failed
          bash scripts/ci/commit_push.sh -n "mesoindex poll" -m "mesoindex.com prices $(date -u '+%F %H:%M')" \
            -s data/sources/mesoindex.json
