# Every 3 hours: meowdb Free Market (price summaries + live listings, no login) -> data/sources/meowdb_market.json + D.mdb,
# rebuild dist/index.html, commit to main. meowdb sits behind Cloudflare, so the fetch runs in headless Chromium (~30 min).
# The fetch job runs outside the main-pipeline group so the meso.watch poll isn't held up; only the commit job queues with it.
# A failed fetch keeps the old file and commits nothing. No vendor/ needed.
name: meowdb market poll
on:
  schedule: [{cron: "41 */3 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: cp data/sources/meowdb_market.json /tmp/old.json 2>/dev/null || true; node scripts/fetch_meowdb_market.js
      - name: Keep only a new file
        run: cmp -s data/sources/meowdb_market.json /tmp/old.json && rm data/sources/meowdb_market.json || true
      - uses: actions/upload-artifact@v4
        with: { name: meowdb-market, path: data/sources/meowdb_market.json, if-no-files-found: ignore, retention-days: 2 }
  commit:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: main-pipeline
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/download-artifact@v4
        with: { name: meowdb-market, path: /tmp/mdb }
        continue-on-error: true
      - name: Build, commit
        # on a push race, start again from the new main, never merge data.json
        run: |
          [ -f /tmp/mdb/meowdb_market.json ] || { echo "no new fetch"; exit 0; }
          for i in 1 2 3; do
            cp /tmp/mdb/meowdb_market.json data/sources/meowdb_market.json
            python3 scripts/meowdb_market.py && python3 scripts/build.py | tail -2
            git add data/sources/meowdb_market.json data/data.json dist/index.html
            if git diff --cached --quiet; then echo "no change"; exit 0; fi
            git -c user.name="meowdb market bot" -c user.email="actions@github.com" commit -qm "meowdb market prices $(date -u '+%F %H:%M')"
            git push origin HEAD:main && exit 0
            sleep $((i*15)); git fetch -q origin main; git reset -q --hard origin/main
          done
          exit 1
