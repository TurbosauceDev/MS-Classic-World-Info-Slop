# Every 3 hours: meowdb Free Market (price summaries + live listings, no login) -> data/sources/meowdb_market.json + D.mdb,
# commit to main (pages.yml builds the page). meowdb sits behind Cloudflare, so the fetch runs in Chromium (~30 min).
# 2026-10-28: meowdb 403s headless browsers on its market API ("Headless browsers are blocked here"), so the fetch
# runs a real headed Chromium under xvfb (probe-verified); if the wall widens, the fetcher drops browse discovery and
# sweeps the open per-item endpoints instead (see scripts/fetch_meowdb_market.js). A failed fetch keeps the old file.
# The fetch job runs outside the main-pipeline group so the meso.watch poll isn't held up; only the commit job queues with it.
# Step-level timeouts (audit P11): a hung step releases the shared lock before the job ceiling (commit job).
name: meowdb market poll
on:
  schedule: [{cron: "41 */3 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions: { contents: read }   # scrapes an outside site for 30 min: no write token here, only the commit job has one
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.64.1 && npx playwright install --with-deps chromium   # pinned (was latest)
        timeout-minutes: 12
      - run: which xvfb-run || sudo apt-get install -y xvfb   # headed chromium needs a display (preinstalled on runner images)
      - run: cp data/sources/meowdb_market.json /tmp/old.json 2>/dev/null || true; xvfb-run -a node scripts/fetch_meowdb_market.js
        timeout-minutes: 40
      - name: Keep only a new file
        run: cmp -s data/sources/meowdb_market.json /tmp/old.json && rm data/sources/meowdb_market.json || true
      - uses: actions/upload-artifact@v7
        with: { name: meowdb-market, path: data/sources/meowdb_market.json, if-no-files-found: ignore, retention-days: 2 }
  commit:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: main-pipeline
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/download-artifact@v4
        with: { name: meowdb-market, path: /tmp/mdb }
        continue-on-error: true
      - name: Build, commit
        timeout-minutes: 8
        # push races: scripts/ci/commit_push.sh (resets onto the new main, never merges data.json)
        run: |
          [ -f /tmp/mdb/meowdb_market.json ] || { echo "no new fetch"; exit 0; }
          cp /tmp/mdb/meowdb_market.json data/sources/meowdb_market.json
          python3 scripts/meowdb_market.py
          bash scripts/ci/commit_push.sh -n "meowdb market bot" -m "meowdb market prices $(date -u '+%F %H:%M')" \
            -s data/sources/meowdb_market.json -a data/data.json -r "python3 scripts/meowdb_market.py"
