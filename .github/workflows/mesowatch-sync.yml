# When the meso.watch poller pushes a new CSV to data/mesowatch-sync, run Danny's
# refresh_mesowatch.sh (fetch CSV -> fetch_mesowatch.py -> build_data.py prices
# -> build.py), then ask Claude (Anthropic API) to write a commit message from
# the diff, then commit + push to default branch. Pages redeploys via the
# workflow_run hook added to pages.yml.
#
# Standing approval: per Danny, 2026-10-19, CSV refreshes are pre-approved for
# push + publish. This workflow does not touch anything outside
# data/sources/mesowatch_prices.json, data/data.json, dist/index.html.
# Anything else (new endpoints, schema changes, OSMS bumps) is out of scope.

name: mesowatch-sync
on:
  push:
    branches: ["data/mesowatch-sync"]
    paths: ["data/sources/mesowatch_csv/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/trusting-bell-fqgar6
          fetch-depth: 0   # git log + git show HEAD:<path> need full history of the default branch
      - name: Run refresh script
        run: bash scripts/refresh_mesowatch.sh
      - name: Check for changes
        id: check
        run: |
          if git diff --quiet -- data/sources/mesowatch_prices.json; then
            echo "changed=0" >> $GITHUB_OUTPUT
            echo "No changes to mesowatch_prices.json — nothing to commit."
          else
            echo "changed=1" >> $GITHUB_OUTPUT
          fi
      - name: Ask Claude for commit message
        if: steps.check.outputs.changed == '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-4-5
        run: |
          python3 scripts/mesowatch_claude_review.py > /tmp/commit_msg.txt 2> /tmp/claude_err.txt
          if [ ! -s /tmp/commit_msg.txt ]; then
            echo "chore(mesowatch): refresh prices ($(date -u +%F))" > /tmp/commit_msg.txt
            echo "[warn] Claude review returned empty, using fallback" >> /tmp/claude_err.txt
          fi
          cat /tmp/claude_err.txt || true
          echo "--- commit message ---"
          cat /tmp/commit_msg.txt
      - name: Commit + push
        if: steps.check.outputs.changed == '1'
        run: |
          git config user.name "meso.watch bot"
          git config user.email "actions@github.com"
          git add data/sources/mesowatch_prices.json data/data.json dist/index.html
          git commit -F /tmp/commit_msg.txt
          git push origin HEAD:claude/trusting-bell-fqgar6
