# One-off diagnostic for the meowdb market outage (remove after reading logs).
name: meowdb probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.64.1 && npx playwright install --with-deps chromium
        timeout-minutes: 12
      - run: which xvfb-run || sudo apt-get install -y xvfb
      - run: xvfb-run -a node scripts/probe_meowdb.js
        timeout-minutes: 10
