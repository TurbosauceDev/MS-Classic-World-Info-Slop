# Every 3 hours: mesoarbitrage.com + maplestory.watch shop-scan prices (and maplestory.watch per-shop listings for the Items
# page where-to-buy list) -> data/sources/shopscans.json + D.ma / D.mw, commit to main when changed (pages.yml builds the page).
# A failed fetch exits 0 and commits nothing. No vendor/ needed. Own workflow (the meso.watch poll belongs to the meso.watch
# helper); same concurrency group as the other polls so commits queue.
# Step-level timeouts (audit P11): a hung step releases the shared lock before the job ceiling.
name: shopscans poll
on:
  schedule: [{cron: "11 1-23/3 * * *"}]   # off meowdb's :41 slot (only one pending run per concurrency group survives)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: main-pipeline
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-24.04   # not -latest: it became 26.04, which Playwright 1.56.1 refuses (2026-10-31)
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - run: python3 tests/shopscans_test.py
        timeout-minutes: 2
      - name: Install headless chromium (browser fallback for challenge walls)
        # maplestory.watch serves its Cloudflare challenge to non-browser clients (10-28): the fetchers
        # fall back to a real browser (decisions.md 2026-10-28); the poll runs every 3 h so install up front
        timeout-minutes: 5
        run: npm ci --ignore-scripts --no-audit --no-fund && npx playwright install --with-deps chromium   # versions: root package.json
      - name: Fetch, build, commit if changed
        timeout-minutes: 20
        # push races: scripts/ci/commit_push.sh resets onto the new main, restores our sources, re-runs the step
        # fetch_alt_sources.py writes the two standalone raw-source files
        # (maplestorywatch_prices.json + mesoarbitrage_prices.json) so the
        # data-freshness panel on the site has timestamps for each source.
        # fetch_shopscans.py then builds the combined shopscans.json (D.mw/D.ma).
        run: |
          python3 scripts/fetch_alt_sources.py > /tmp/alt.log 2>&1; cat /tmp/alt.log || true
          python3 scripts/fetch_shopscans.py > /tmp/ss.log; cat /tmp/ss.log
          [ -f data/sources/shopscans.json ] || exit 0   # first fetch failed
          bash scripts/ci/commit_push.sh -n "shopscans bot" -m "shop-scan prices (mesoarbitrage, maplestory.watch) $(date -u '+%F %H:%M')" \
            -s data/sources/shopscans.json -s data/sources/maplestorywatch_prices.json -s data/sources/mesoarbitrage_prices.json \
            -a data/data.json -r "python3 scripts/ci/apply_step.py fetch_shopscans"
