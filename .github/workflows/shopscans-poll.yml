# Every 3 hours: mesoarbitrage.com + maplestory.watch shop-scan prices (and maplestory.watch per-shop listings for the Items
# page where-to-buy list) -> data/sources/shopscans.json + D.ma / D.mw, rebuild dist/index.html, commit to main when changed.
# A failed fetch exits 0 and commits nothing. No vendor/ needed. Own workflow (the meso.watch poll belongs to the meso.watch
# helper); same concurrency group as the other polls so commits queue.
name: shopscans poll
on:
  schedule: [{cron: "41 */3 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: main-pipeline
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - run: python3 tests/shopscans_test.py
      - name: Fetch, build, commit if changed
        # on a push race (meso.watch poll commits often), start again from the new main, never merge data.json
        run: |
          python3 scripts/fetch_shopscans.py > /tmp/ss.log; cat /tmp/ss.log
          [ -f data/sources/shopscans.json ] || exit 0   # first fetch failed
          cp data/sources/shopscans.json /tmp/ss.json
          for i in 1 2 3; do
            python3 scripts/build.py | tail -2
            git add data/sources/shopscans.json data/data.json dist/index.html
            if git diff --cached --quiet; then echo "no change"; exit 0; fi
            git -c user.name="shopscans bot" -c user.email="actions@github.com" commit -qm "shop-scan prices (mesoarbitrage, maplestory.watch) $(date -u '+%F %H:%M')"
            git push origin HEAD:main && exit 0
            sleep $((i*15)); git fetch -q origin main; git reset -q --hard origin/main
            cp /tmp/ss.json data/sources/shopscans.json
            python3 -c "import sys,json;sys.path.insert(0,'scripts');import fetch_shopscans as c;D=json.load(open('data/data.json'));c.step(D);open('data/data.json','w').write(json.dumps(D,separators=(',',':')))"
          done
          exit 1
