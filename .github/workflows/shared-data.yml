# Daily: pull the grind tracker's shared runs (Confirmed Drops) into data/data.json, rebuild dist/index.html and commit
# to the tracker branch when something changed. Doesn't touch the Pages branch (that still needs Danny's OK).
name: shared-data
on:
  schedule: [{cron: "17 9 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/project-thread-5h55q0 }
      - run: python3 scripts/fetch_shared.py
      - run: python3 scripts/build.py | tail -3
      - name: Commit if changed
        run: |
          git add data/sources/shared_runs.json data/data.json dist/index.html
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git -c user.name="shared-data bot" -c user.email="actions@github.com" commit -m "Shared runs refresh $(date -u +%F)"
          git push origin HEAD:claude/project-thread-5h55q0
