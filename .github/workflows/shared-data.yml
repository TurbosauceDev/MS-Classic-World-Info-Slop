# Daily: pull the grind tracker's shared runs (Confirmed Drops) into data/data.json, and commit
# to the default (Pages) branch when something changed (Danny OK'd, 2026-10-18).
name: shared-data
on:
  schedule: [{cron: "19 9 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
# same group as the price polls, which commit to main every few minutes
concurrency:
  group: main-pipeline
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Fetch, build, commit if changed
        # on a push race, start again from the new main (never merge data.json)
        run: |
          for i in 1 2 3; do
            python3 scripts/fetch_shared.py
            git add data/sources/shared_runs.json data/data.json
            if git diff --cached --quiet; then echo "no change"; exit 0; fi
            git -c user.name="shared-data bot" -c user.email="actions@github.com" commit -qm "Shared runs refresh $(date -u +%F)"
            git push origin HEAD:main && exit 0
            sleep $((i*15)); git fetch -q origin main; git reset -q --hard origin/main
          done
          exit 1
