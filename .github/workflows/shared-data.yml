# Daily: pull the grind tracker's shared runs (Confirmed Drops) into data/data.json, and commit
# to the default (Pages) branch when something changed (Danny OK'd, 2026-10-18).
# Step-level timeouts (audit P11): a hung step releases the shared lock before the job ceiling.
name: shared-data
on:
  schedule: [{cron: "19 9 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
# same group as the price polls, which commit to main every few minutes
concurrency:
  group: main-pipeline
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Fetch, build, commit if changed
        timeout-minutes: 8
        # push races: scripts/ci/commit_push.sh (resets onto the new main, never merges data.json)
        run: |
          python3 scripts/fetch_shared.py
          bash scripts/ci/commit_push.sh -n "shared-data bot" -m "Shared runs refresh $(date -u +%F)" \
            -s data/sources/shared_runs.json
