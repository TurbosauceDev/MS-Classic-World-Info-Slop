# Every 2 hours: classicmarket.kr public trade posts -> data/sources/classicmarket_prices.json + D.cm, rebuild
# (pages.yml builds the page), commit to main when prices changed. A failed fetch exits 0 and commits nothing. No vendor/ needed.
# Own workflow (the meso.watch poll belongs to the meso.watch helper); same concurrency group so commits queue.
# Step-level timeouts (audit P11): a hung step releases the shared lock before the job ceiling.
name: classicmarket poll
on:
  schedule: [{cron: "23 */2 * * *"}, {cron: "53 */2 * * *"}]   # two entries: GitHub skips scheduled runs under load (10:23 and 12:23 on 10-21 never fired)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: main-pipeline
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { ref: main }
      - run: python3 tests/classicmarket_test.py
        timeout-minutes: 2
      - name: Fetch, build, commit if changed
        timeout-minutes: 8
        env:
          CLASSICMARKET_COOKIE: ${{ secrets.CLASSICMARKET_COOKIE }}
        # push races: scripts/ci/commit_push.sh resets onto the new main, restores our sources, re-runs the step
        run: |
          python3 scripts/fetch_classicmarket_listings.py > /tmp/cm.log; cat /tmp/cm.log
          python3 scripts/fetch_classicmarket_market.py   # Layer B: needs the cookie; warns and skips without it
          [ -f data/sources/classicmarket_prices.json ] || exit 0   # first fetch failed
          bash scripts/ci/commit_push.sh -n "classicmarket bot" -m "classicmarket.kr prices $(date -u '+%F %H:%M')" \
            -s data/sources/classicmarket_prices.json -s data/sources/classicmarket_market.json
