# Every 2 hours: classicmarket.kr public trade posts -> data/sources/classicmarket_prices.json + D.cm, rebuild
# dist/index.html, commit to main when prices changed. A failed fetch exits 0 and commits nothing. No vendor/ needed.
# Own workflow (the meso.watch poll belongs to the meso.watch helper); same concurrency group so commits queue.
name: classicmarket poll
on:
  schedule: [{cron: "23 */2 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: main-pipeline
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - run: python3 tests/classicmarket_test.py
      - name: Fetch, build, commit if changed
        # on a push race (meso.watch poll commits often), start again from the new main, never merge data.json
        run: |
          python3 scripts/fetch_classicmarket_listings.py > /tmp/cm.log; cat /tmp/cm.log
          [ -f data/sources/classicmarket_prices.json ] || exit 0   # first fetch failed
          cp data/sources/classicmarket_prices.json /tmp/cm.json
          for i in 1 2 3; do
            python3 scripts/build.py | tail -2
            git add data/sources/classicmarket_prices.json data/data.json dist/index.html
            if git diff --cached --quiet; then echo "no change"; exit 0; fi
            git -c user.name="classicmarket bot" -c user.email="actions@github.com" commit -qm "classicmarket.kr prices $(date -u '+%F %H:%M')"
            git push origin HEAD:main && exit 0
            sleep $((i*15)); git fetch -q origin main; git reset -q --hard origin/main
            cp /tmp/cm.json data/sources/classicmarket_prices.json
            python3 -c "import sys,json;sys.path.insert(0,'scripts');import fetch_classicmarket_listings as c;D=json.load(open('data/data.json'));c.step(D);open('data/data.json','w').write(json.dumps(D,separators=(',',':')))"
          done
          exit 1
