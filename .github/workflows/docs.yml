# Docs check on every push/PR (no path filter, so a code move that breaks the notes goes red): every path and command
# named in CLAUDE.md and docs/ai/*.md exists, and docs/ai/fixtures.md lists every test image;
# tests/digest.test.js lints the digest, checks config/digest.json and that design.md commands do what they claim. No installs, seconds.
name: Docs check
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tests/docs.test.js
      - run: node tests/digest.test.js
