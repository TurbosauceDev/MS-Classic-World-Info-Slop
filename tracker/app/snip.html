<!doctype html>
<html><head><meta charset="utf-8"><title>Mark your potions</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; style-src 'unsafe-inline'">
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#000; cursor:crosshair; user-select:none; font:15px system-ui, sans-serif; }
  #shot { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  #dim { position:absolute; inset:0; background:rgba(0,0,0,.45); }
  #box { position:absolute; border:2px solid #b9a3ff; box-shadow:0 0 0 9999px rgba(0,0,0,.45); display:none; }
  #tip { position:absolute; top:16px; left:50%; transform:translateX(-50%); background:#2b2540; color:#fff; padding:8px 14px; border-radius:8px; }
</style></head>
<body>
  <img id="shot" alt="">
  <div id="dim"></div><div id="box"></div>
  <div id="tip">Drag a box around your potion quick slots (or the Use tab). Esc to cancel.</div>
  <script src="snip.js"></script>
</body></html>
