<title>MS Classic Overlay</title>
<style>
  /* Elv skin font (0.2.92): PT Sans Narrow under ParaType's free font licence — same files as the tracker window. */
  @font-face { font-family:"PT Sans Narrow"; src:url("fonts/PT_Sans-Narrow-Web-Regular.ttf") format("truetype"); font-weight:400; font-display:swap; }
  @font-face { font-family:"PT Sans Narrow"; src:url("fonts/PT_Sans-Narrow-Web-Bold.ttf") format("truetype"); font-weight:700; font-display:swap; }
  /* the tracker's own colour tokens (themes.js applies the player's theme to :root each push; these are the Default theme,
     light and dark, for the first paint). The window itself is transparent: only the widgets draw. */
  :root { --bg:#e7ddf9; --panel:#f7f1ff; --ink:#2a2142; --muted:#685c94; --line:#cfbff0; --accent:#7d58d6; --accent-soft:#dccbfa; --on-accent:#f7f1ff; --leaf:#3d7a5c; --warn:#9a6a00; --bad:#a3322b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1f1931; --panel:#2a2243; --ink:#f0eafd; --muted:#b6aad8; --line:#453a64; --accent:#d2bffb; --accent-soft:#41346a; --on-accent:#2a2243; --leaf:#7cc9a2; --warn:#e2b44a; --bad:#ef7a70; } }
  * { box-sizing:border-box; }
  /* .hidden is the JS visibility switch for #ovgrid, the snap guides and the panel — it MUST exist as a real rule.
     The 0.2.75 rewrite dropped the old #ovbar.hidden rule and the bare class toggled nothing, so the alignment grid
     painted over the game permanently, edit mode or not (Danny 10-28, twice: "the grid is always there edit mode or
     not" on 0.2.76, whose logic gate was fine but whose switch was wired to missing CSS). */
  .hidden { display:none; }
  html, body { background:transparent; overflow:hidden; }
  body { margin:0; color:var(--ink); font:13px/1.4 system-ui, sans-serif; font-variant-numeric:tabular-nums; user-select:none; }
  /* a widget: one small glass card (Focus Mode's shadow language, maplestory.watch's air), floating wherever the player
     put it, on any monitor (the window spans the whole desktop). backdrop-filter blurs the game behind it. */
  /* a card fits its content (Danny 10-28): max-content width up to --mw (a long run-log line ellipsises there), no minimum.
     Every look knob is a custom property the inspector sets per card (styleCard in overlay.js), defaults below = the old look. */
  .ovw { position:absolute; box-sizing:border-box; width:max-content; min-width:0; max-width:var(--mw, 360px); padding:var(--pv, 9px) var(--ph, 13px); border-radius:var(--rad, 12px);
    background:color-mix(in srgb, var(--panel) var(--glass, 82%), transparent);
    -webkit-backdrop-filter:blur(var(--blur, 14px)) saturate(1.2); backdrop-filter:blur(var(--blur, 14px)) saturate(1.2);
    border:1px solid var(--bc, color-mix(in srgb, var(--line) 72%, transparent));
    box-shadow:var(--sh, 0 1px 2px rgba(0,0,0,.22), 0 12px 32px -12px rgba(0,0,0,.45));
    transition:filter .15s ease, border-color .15s ease, box-shadow .15s ease; }
  body.edit .ovw { background:color-mix(in srgb, var(--panel) 94%, transparent); cursor:move;
    border-color:color-mix(in srgb, var(--line) 90%, var(--accent) 10%); }
  body.edit .ovw:hover, body.edit .ovw.moving { border-color:var(--accent); }
  body.edit .ovw.moving { opacity:.85; }
  /* edit mode v2 (Danny 2026-10-28, ElvUI's Toggle Anchors + WeakAuras' MoverSizer): the picked card gets a bright ring,
     a hovered panel row spotlights its card (ElvUI dims the rest), the corner grip resizes (WeakAuras' handles). */
  body.edit .ovw.sel { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), 0 12px 32px -12px rgba(0,0,0,.45); }
  body.dim .ovw:not(.spot) { filter:brightness(.55); }
  .ovw .rsz { display:none; position:absolute; right:1px; bottom:1px; width:15px; height:15px; cursor:nwse-resize;
    border-right:2px solid var(--accent); border-bottom:2px solid var(--accent); border-radius:0 0 10px 0; opacity:.65; }
  body.edit .ovw .rsz { display:block; }
  body.edit .ovw .rsz:hover { opacity:1; }
  /* edge resize (Danny 10-29: "dragging an edge should make it taller, or longer"): the right edge stretches it wider,
     the bottom edge taller, the corner still does both. The ticks stay invisible until the card or the edge is hovered,
     so a locked overlay never shows them and edit mode stays quiet. */
  .ovw .rsz-e, .ovw .rsz-s { display:none; position:absolute; opacity:0; transition:opacity .12s ease; }
  .ovw .rsz-e { right:0; top:14px; bottom:14px; width:8px; cursor:ew-resize; }
  .ovw .rsz-s { left:14px; right:14px; bottom:0; height:8px; cursor:ns-resize; }
  .ovw .rsz-e::after, .ovw .rsz-s::after { content:""; position:absolute; background:var(--accent); border-radius:2px; opacity:.55; }
  .ovw .rsz-e::after { right:2px; top:50%; width:3px; height:26px; transform:translateY(-50%); }
  .ovw .rsz-s::after { bottom:2px; left:50%; width:26px; height:3px; transform:translateX(-50%); }
  body.edit .ovw .rsz-e, body.edit .ovw .rsz-s { display:block; }
  body.edit .ovw:hover .rsz-e, body.edit .ovw:hover .rsz-s { opacity:.5; }
  body.edit .ovw .rsz-e:hover, body.edit .ovw .rsz-s:hover { opacity:1; }
  .ovw header { display:flex; align-items:center; margin:0 0 3px; }
  .ovw header .t { flex:1; min-width:0; font-size:10px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--muted);
    text-shadow:0 1px 2px rgba(0,0,0,.3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }   /* ellipsis, not a wrap, in a skinny box */
  .ovw header button { background:none; border:0; color:var(--muted); font:inherit; font-size:13px; line-height:1; padding:1px 5px; border-radius:6px; cursor:pointer; }
  .ovw header button:hover { color:var(--bad); }
  .ovw .b { zoom:var(--fs, 1); }
  /* strange boxes (Danny 10-29): the corner grip — or a Width/Height number in the inspector — pins an axis, and the
     card stops following its content: a wide box lets the lines spread, a tall one shows more of the log, a short one
     scrolls inside, a skinny one ellipsises. Blank = fit the content, exactly like before. */
  .ovw.sizedW { width:var(--w); max-width:none; }
  .ovw.sizedH { height:var(--h); display:flex; flex-direction:column; }
  .ovw.sizedH header { flex:none; }
  .ovw.sizedH .b { flex:1 1 auto; min-height:0; overflow:auto; scrollbar-width:thin; display:flex; flex-direction:column; }
  /* a pinned-tall card centres its content (auto margins above and below collapse to 0 when the content overflows, so
     scrolling still starts at the top); flow cards (log, loot, map) stay top-aligned and grow lines to fill instead */
  .ovw.sizedH .b:not(.flow)::before { content:""; margin-top:auto; }
  .ovw.sizedH .b:not(.flow)::after { content:""; margin-bottom:auto; }
  .ovw.sizedH .b::-webkit-scrollbar { width:8px; } .ovw.sizedH .b::-webkit-scrollbar-track { background:transparent; }
  .ovw.sizedH .b::-webkit-scrollbar-thumb { background:var(--line); border-radius:4px; }
  .ovw.sizedW .rows > div { min-width:0; } .ovw.sizedW .spk svg { width:100%; }   /* a wide card: the trend line stretches, rows shrink to fit */
  .ovw.sizedW .mrow { flex-wrap:wrap; row-gap:1px; } .ovw.sizedW .mrow b { min-width:0; }   /* a skinny card: name and its number stack instead of fighting */
  .ovw.sizedW .lvbar { grid-template-columns:auto minmax(24px, 1fr) auto; }
  .ovw.ovhide { display:none; }
  /* Borderless cards (0.2.94): Simple / Focus views. Fixed width = Max width; the corner grip scales the whole card */
  .ovw[data-k="simple"], .ovw[data-k="focus"] { width:var(--mw, 380px); }
  .ovw[data-k="simple"], .ovw[data-k="focus"] { text-shadow:0 1px 3px rgba(0,0,0,.65); }
  .ovw.bdIn { animation:bdin .32s ease-out; } @keyframes bdin { from { opacity:0; } }
  .svHead { display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
  .svMap { font-size:15px; font-weight:800; color:var(--ink); line-height:1.2; }
  .sub b { color:var(--ink); }
  .svK { font-size:10px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
  .svHero { margin-top:8px; } .svHero .big { font-size:26px; }
  .svTiles { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px; }
  .svTiles b { display:block; font-size:16px; color:var(--ink); } .svTiles span { font-size:11px; color:var(--muted); }
  .svLvl { display:grid; grid-template-columns:auto 1fr auto auto; gap:7px; align-items:center; margin-top:8px; font-weight:700; font-size:11px; color:var(--muted); }
  .svLvl b { color:var(--warn); } .svLvl .trk { height:8px; min-width:60px; }
  .svChart { margin-top:8px; color:var(--accent); } .svChart svg { display:block; width:100%; height:56px; }
  .svPots { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:8px; }
  .svPot { display:flex; gap:6px; align-items:center; } .svPot div { display:grid; line-height:1.15; } .svPot span { font-size:10px; color:var(--muted); }
  .svMoney { display:grid; grid-template-columns:auto auto 1fr; gap:1px 10px; margin-top:8px; font-size:12px; }
  .svMoney span { color:var(--muted); font-size:11px; }
  .svTwo { display:grid; grid-template-columns:1fr 1fr; gap:14px; } .svCols { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:8px; }
  .ovw[data-k="focus"] .b { container-type:inline-size; }
  @container (max-width: 520px) { .svTwo { grid-template-columns:1fr; } .svCols { grid-template-columns:1fr 1fr; } }
  @container (max-width: 300px) { .svCols { grid-template-columns:1fr; } .svTiles { grid-template-columns:1fr; } }
  .svl { width:100%; border-collapse:collapse; font-size:12px; } .svl td { padding:1px 0; } .svl td.n { text-align:right; font-weight:700; }
  .svl .more td { color:var(--muted); font-size:11px; } .svl .ico, .svPot .ico { width:20px; height:20px; vertical-align:middle; margin-right:5px; image-rendering:pixelated; }
  #ovBd[hidden] { display:none; }
  body.locked .ovw:not(.showt) header { display:none; } body.locked .ovw.showt header button { display:none; }   /* locked = pure overlay: nothing on a card but its numbers */
  body.locked .ovw .rsz, body.locked .ovw .rsz-e, body.locked .ovw .rsz-s, body.locked .ovw .gb { display:none; }
  /* the group badge (Danny 10-29: grouped modules move together): the letter sits in the header while editing */
  .ovw .gb { display:none; font-size:9px; font-weight:700; line-height:1; padding:2px 5px; margin-right:5px;
    background:var(--accent); color:var(--on-accent); border-radius:7px; }
  body.edit .ovw .gb.on { display:inline-block; }
  .wrow .wgb { font-size:9px; font-weight:700; line-height:1; padding:2px 4px; background:var(--accent); color:var(--on-accent); border-radius:6px; }
  .big { font-size:20px; font-weight:800; line-height:1.15; color:var(--accent); text-shadow:0 1px 2px rgba(0,0,0,.35); }
  .big small { font-size:11px; font-weight:600; color:var(--muted); text-shadow:none; }
  /* the card sparkline (0.2.80): the rate's recent trend in the card's accent colour, tucked under the big number */
  .spk { margin:3px 0 2px; color:var(--accent); }
  .spk:empty { margin:0; }
  .spk svg { display:block; }
  .mapname { font-size:16px; font-weight:700; color:var(--warn); line-height:1.2; overflow-wrap:anywhere; text-shadow:0 1px 2px rgba(0,0,0,.35); }
  .sub { font-size:11px; color:var(--muted); margin-top:1px; }
  .sect { font-size:10px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin:7px 0 2px; }
  .rows { margin-top:4px; display:grid; gap:1px 12px; grid-template-columns:auto auto; justify-content:start; }
  .rows > div { display:flex; gap:7px; align-items:baseline; }
  .rows span { font-size:11px; color:var(--muted); }
  .rows b { font-weight:700; }
  .mrow { display:flex; justify-content:space-between; gap:12px; padding:1.5px 0; }
  .mrow b { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mrow span { color:var(--muted); white-space:nowrap; }
  .mrow span.soon { color:var(--warn); }   /* back within 2 min: worth looking up from the grind */
  .lr { padding:1px 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lr time { color:var(--muted); margin-right:6px; }
  .lr.exp span { color:var(--leaf); } .lr.meso span { color:var(--warn); } .lr.loot span { color:var(--ink); }
  .lr.level span, .lr.kpq span, .lr.run span { color:var(--accent); } .lr.death span, .lr.bad span { color:var(--bad); }
  .lr.map, .lr.sep, .lr.msg { color:var(--muted); font-style:italic; }
  .pos { color:var(--leaf); } .neg { color:var(--bad); } .dim { color:var(--muted); }
  .empty { color:var(--muted); font-size:12px; padding:2px 0; }
  /* Chat blocker (0.2.108): opaque, sits under the other cards; the bars are tracker-drawn from the HP/MP + EXP reads */
  .ovw[data-k="blocker"] { z-index:-1 !important; background:color-mix(in srgb, var(--panel) var(--glass, 100%), #000); }
  body.edit .ovw[data-k="blocker"] { background:color-mix(in srgb, var(--panel) 100%, #000); }
  .ovw[data-k="blocker"] .b { height:100%; display:flex; align-items:center; }
  .vbars { display:flex; gap:8px; width:100%; } .vbars.col { flex-direction:column; } .vbars.col .vb { flex:0 0 20px; }   /* stacked: a 0 basis collapsed the bars to nothing */
  .vb { position:relative; flex:1 1 0; min-width:0; height:20px; border-radius:3px; overflow:hidden; background:color-mix(in srgb, var(--bg) 55%, #000); border:1px solid color-mix(in srgb, var(--line) 70%, transparent); font-size:11px; font-weight:700; color:#fff; }
  .vb i { position:absolute; inset:0 auto 0 0; transition:width .25s ease; }
  .vb.hp i { background:#c8372d; } .vb.mp i { background:#2f6fd0; } .vb.xp i { background:#d9a21b; }
  .vb span { position:absolute; top:0; bottom:0; display:flex; align-items:center; padding:0 6px; text-shadow:0 1px 2px rgba(0,0,0,.8); white-space:nowrap; }
  .vb .vl { left:0; } .vb .vn { right:0; }
  .vb.stale { opacity:.55; }
  body:not(.edit) .ovw.nobg { background:none !important; border-color:transparent !important; box-shadow:none !important; backdrop-filter:none !important; -webkit-backdrop-filter:none !important }
  .bagin { margin-top:8px; display:flex; justify-content:center }
  .bagrow { display:flex; gap:8px; align-items:center } .bagrow.col { flex-direction:column; align-items:flex-start }
  .bagI { display:inline-flex; align-items:center; gap:6px; padding:4px; border-radius:8px; border:1px solid color-mix(in srgb, currentColor 45%, transparent); background:color-mix(in srgb, currentColor 14%, transparent); cursor:pointer; transition:color .6s, background .6s; font-size:11px; font-weight:700; }
  .bagI svg { width:24px; height:24px; display:block } .bagI em { font-style:normal; padding-right:4px }
  .bagI.idle { opacity:.55 } .bagI:hover { background:color-mix(in srgb, currentColor 28%, transparent) }
  .bagI.pulse { animation:bagGlow 2.2s ease-in-out infinite }
  @keyframes bagGlow { 0%,100% { box-shadow:0 0 0 0 transparent } 50% { box-shadow:0 0 10px 2px color-mix(in srgb, currentColor 70%, transparent) } }
  @media (prefers-reduced-motion:reduce) { .bagI.pulse { animation:none; box-shadow:0 0 7px 1px currentColor } }
  .lvbar { display:grid; grid-template-columns:auto minmax(60px, 130px) auto; gap:7px; align-items:center; margin-top:6px; font-weight:700; font-size:11px; color:var(--muted); }
  .lvbar b { color:var(--warn); }
  .trk { position:relative; height:8px; border-radius:4px; background:color-mix(in srgb, var(--panel) 55%, transparent); border:1px solid color-mix(in srgb, var(--line) 70%, transparent); }
  .trk i { position:absolute; inset:0 auto 0 0; border-radius:3px; background:var(--leaf); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--muted); margin-right:7px; vertical-align:1px; }
  .dot.ok { background:var(--leaf); } .dot.warn { background:var(--warn); }
  .lico { height:1.2em; width:auto; image-rendering:pixelated; vertical-align:-0.28em; margin-right:4px; }
  /* the alignment grid (WoW Edit Mode / ElvUI): 1 px lines on the grid spacing, red-ish centre axes like ElvUI's. */
  #ovgrid { position:fixed; inset:0; z-index:1; pointer-events:none; --gs:64px;
    background-image:linear-gradient(to right, color-mix(in srgb, var(--ink) 22%, transparent) 1px, transparent 1px),
      linear-gradient(to bottom, color-mix(in srgb, var(--ink) 22%, transparent) 1px, transparent 1px);
    background-size:var(--gs) var(--gs); }
  #ovgrid::before { content:""; position:absolute; left:50%; top:0; bottom:0; width:1px; background:color-mix(in srgb, var(--bad) 55%, transparent); }
  #ovgrid::after { content:""; position:absolute; top:50%; left:0; right:0; height:1px; background:color-mix(in srgb, var(--bad) 55%, transparent); }
  /* snap guides (WeakAuras' alignment lines): one vertical + one horizontal accent line while a dragged card aligns. */
  .gl { position:fixed; z-index:8; pointer-events:none; background:var(--accent); box-shadow:0 0 6px var(--accent); }
  #ovgv { top:0; bottom:0; width:1px; } #ovgh { left:0; right:0; height:1px; }
  /* alert toasts (0.2.78, the conditions engine): the tracker's triggers pop these top-right while you play; the card
     they belong to pulses (WeakAuras' region flash). Hidden while editing, like the grid — edit mode is for layout. */
  #ovtoasts { position:fixed; top:12px; right:12px; z-index:9; display:grid; gap:6px; justify-items:end; pointer-events:none; }
  #ovtoasts.hidden { display:none; }
  .toast { max-width:300px; padding:7px 11px; border-radius:10px; font-size:12px; font-weight:600; color:var(--ink);
    background:color-mix(in srgb, var(--panel) 94%, transparent);
    -webkit-backdrop-filter:blur(16px) saturate(1.2); backdrop-filter:blur(16px) saturate(1.2);
    border:1px solid var(--line); box-shadow:0 1px 2px rgba(0,0,0,.22), 0 12px 32px -12px rgba(0,0,0,.45); }
  .toast.warn { border-color:color-mix(in srgb, var(--warn) 65%, var(--line)); }
  .toast.good { border-color:color-mix(in srgb, var(--leaf) 65%, var(--line)); }
  @keyframes ovflash { 0%,100% { box-shadow:0 1px 2px rgba(0,0,0,.22), 0 12px 32px -12px rgba(0,0,0,.45); }
    50% { box-shadow:0 0 0 3px var(--accent), 0 12px 32px -12px rgba(0,0,0,.45); } }
  .ovw.flash { animation:ovflash .7s ease-in-out 3; }
  /* conditions (0.2.91): a card whose rule is met recolours its content, pulses, or hides (hiding never while editing) */
  .ovw.cmet-color .b { --ink:var(--cc); --accent:var(--cc); }
  .ovw.cmet-pulse { animation:ovflash 1.4s ease-in-out infinite; }
  .ovw.cmet-hide { display:none; }
  body.edit .ovw.cmet-hide { display:block; opacity:.45; }
  /* edit panel: the checkbox strip grew into a proper panel (Danny: "an in-style selection menu instead of that strip of
     boxes") — one glass card, one row per widget, per-widget detail under the picked row, options in the footer. */
  #ovpanel { position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:10; width:302px; max-width:calc(100vw - 20px);
    max-height:calc(100vh - 24px); overflow:auto; padding:9px 11px 10px; border-radius:12px;
    background:color-mix(in srgb, var(--panel) 94%, transparent);
    -webkit-backdrop-filter:blur(16px) saturate(1.2); backdrop-filter:blur(16px) saturate(1.2);
    border:1px solid var(--line); box-shadow:0 1px 2px rgba(0,0,0,.22), 0 12px 32px -12px rgba(0,0,0,.45); }
  #ovpanel.hidden { display:none; }
  #ovpanel > header { display:flex; align-items:center; gap:6px; cursor:move; }
  #ovpanel > header .t { flex:1; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); }
  #ovpanel .btn { background:var(--accent); color:var(--on-accent); border:0; border-radius:8px; padding:3px 11px; font:inherit; font-size:12px; font-weight:600; cursor:pointer; }
  #ovpanel .btn.alt { background:var(--accent-soft); color:var(--ink); }
  #ovpanel .hint { font-size:11px; color:var(--muted); margin:4px 0 5px; }
  .wrow { display:flex; align-items:center; gap:5px; padding:2px 4px; border-radius:8px; }
  .wrow:hover, .wrow.sel { background:color-mix(in srgb, var(--accent-soft) 55%, transparent); }
  .wrow .eye, .wrow .st { background:none; border:0; color:var(--muted); cursor:pointer; font:inherit; width:21px; height:21px; border-radius:6px; line-height:1; padding:0; display:grid; place-items:center; }
  .wrow .eye:hover, .wrow .st:hover { color:var(--accent); background:color-mix(in srgb, var(--panel) 60%, transparent); }
  .wrow .st.del:hover { color:var(--bad); } .wdet select { flex:1; min-width:0; } #ovpanel .foot.add select { flex:1; min-width:0; }
  .wrow .eye.off { color:var(--muted); opacity:.6; }
  .wrow .nm { flex:1; text-align:left; background:none; border:0; color:var(--ink); font:inherit; font-size:12px; font-weight:600; cursor:pointer; padding:2px 4px; border-radius:6px; white-space:nowrap; }
  .wrow.off .nm { color:var(--muted); font-weight:400; }
  .wrow .sv { font-size:11px; color:var(--muted); min-width:36px; text-align:center; }
  .wdet { display:none; padding:5px 6px 7px 31px; border-top:1px dashed color-mix(in srgb, var(--line) 60%, transparent); }
  .wdet.open { display:block; }
  .wdet label { display:flex; gap:8px; align-items:center; font-size:11px; color:var(--muted); margin:4px 0; }
  .wdet label b { min-width:38px; font-weight:600; }
  .wdet input[type=range] { flex:1; accent-color:var(--accent); height:14px; margin:0; }

  .wdet input[type=number] { width:64px; background:color-mix(in srgb, var(--panel) 70%, transparent); border:1px solid var(--line); color:var(--ink); border-radius:6px; font:inherit; font-size:11px; padding:2px 5px; }

  #ovpanel { overflow-x:hidden; } #ovpanel .foot { flex-wrap:wrap; }

  /* the per-module inspector (Danny 10-28): its own pop-up beside the main panel, opens when a card is picked */
  #ovinsp { position:fixed; z-index:11; width:286px; max-width:calc(100vw - 20px); max-height:calc(100vh - 24px); overflow-y:auto; overflow-x:hidden; padding:9px 12px 11px; border-radius:12px;
    background:color-mix(in srgb, var(--panel) 95%, transparent); -webkit-backdrop-filter:blur(16px) saturate(1.2); backdrop-filter:blur(16px) saturate(1.2);
    border:1px solid var(--line); box-shadow:0 1px 2px rgba(0,0,0,.22), 0 12px 32px -12px rgba(0,0,0,.45); scrollbar-width:thin; }

  #ovinsp input[type=checkbox] { accent-color:var(--accent); margin:0; }
  #ovinsp input[type=color] { width:30px; height:20px; padding:0; border:1px solid var(--line); border-radius:5px; background:none; cursor:pointer; }
  #ovinsp select { background:var(--accent-soft); color:var(--ink); border:0; border-radius:7px; font:inherit; font-size:11px; padding:2px 4px; flex:1; min-width:0; }
  #ovinsp .clr { background:none; border:0; color:var(--muted); font:inherit; font-size:11px; cursor:pointer; text-decoration:underline; padding:0 2px; }

  #ovxy { position:fixed; z-index:12; pointer-events:none; padding:1px 7px; font:11px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace;

  /* ---- Elv skin (0.2.92) ----------------------------------------------------------

  body.skin-elv { font-family:"PT Sans Narrow", "Arial Narrow", "Liberation Sans Narrow", Arial, system-ui, sans-serif; }

  body.skin-elv .ovw .gb, body.skin-elv .wrow .wgb { border-radius:0; }

  body.skin-elv .ovw .rsz { border-radius:0; }

  body.skin-elv .toast, body.skin-elv #ovpanel, body.skin-elv #ovinsp { -webkit-backdrop-filter:none; backdrop-filter:none;
    background:color-mix(in srgb, var(--panel) 96%, transparent); box-shadow:none; }
  body.skin-elv .trk { background:color-mix(in srgb, var(--bg) 55%, #000); }   /* the ElvUI bar: dark track, flat fill */
  /* Claude's 0.2.96-0.2.109 cards fall in line too: the Chat blocker's HP/MP/EXP bars and the Bag check icon pills
     were born after the skin and kept their rounded corners — square in Elv like every other bar and button. */
  body.skin-elv .vb, body.skin-elv .vb i, body.skin-elv .bagI,
  body.skin-elv .ovw .b::-webkit-scrollbar-thumb { border-radius:0; }
  body.skin-elv .ovw header .t, body.skin-elv .ovw .big, body.skin-elv .mapname { text-shadow:none; }   /* clean type */

     grey text steps up a point where it carries real information — sub-lines, detail rows, section marks. */
  body.skin-elv .sub, body.skin-elv .rows span { font-size:12px; }
  body.skin-elv .sect { font-size:11px; }
  body.skin-elv .empty { font-size:13px; }
