<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:">
<title>MS Classic Overlay</title>
<style>
  /* the tracker's own colour tokens (themes.js applies the player's theme to :root each push; these are the Default theme,
     light and dark, for the first paint). The window itself is transparent: only the widgets draw. */
  :root { --bg:#e7ddf9; --panel:#f7f1ff; --ink:#2a2142; --muted:#685c94; --line:#cfbff0; --accent:#7d58d6; --accent-soft:#dccbfa; --on-accent:#f7f1ff; --leaf:#3d7a5c; --warn:#9a6a00; --bad:#a3322b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1f1931; --panel:#2a2243; --ink:#f0eafd; --muted:#b6aad8; --line:#453a64; --accent:#d2bffb; --accent-soft:#41346a; --on-accent:#2a2243; --leaf:#7cc9a2; --warn:#e2b44a; --bad:#ef7a70; } }
  * { box-sizing:border-box; }
  html, body { background:transparent; overflow:hidden; }
  body { margin:0; color:var(--ink); font:13px/1.4 system-ui, sans-serif; font-variant-numeric:tabular-nums; user-select:none; }
  /* a widget: one small glass card (Focus Mode's shadow language, maplestory.watch's air), floating wherever the player
     put it, on any monitor (the window spans the whole desktop). backdrop-filter blurs the game behind it. */
  .ovw { position:absolute; min-width:170px; max-width:330px; padding:9px 13px 10px; border-radius:12px;
    background:color-mix(in srgb, var(--panel) 82%, transparent);
    -webkit-backdrop-filter:blur(14px) saturate(1.2); backdrop-filter:blur(14px) saturate(1.2);
    border:1px solid color-mix(in srgb, var(--line) 72%, transparent);
    box-shadow:0 1px 2px rgba(0,0,0,.22), 0 12px 32px -12px rgba(0,0,0,.45); }
  body.edit .ovw { background:color-mix(in srgb, var(--panel) 94%, transparent); cursor:move; }
  body.edit .ovw:hover, body.edit .ovw.moving { border-color:var(--accent); }
  body.edit .ovw.moving { opacity:.85; }
  .ovw header { display:flex; align-items:center; margin:0 0 3px; }
  .ovw header .t { flex:1; font-size:10px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--muted);
    text-shadow:0 1px 2px rgba(0,0,0,.3); }
  .ovw header button { background:none; border:0; color:var(--muted); font:inherit; font-size:13px; line-height:1; padding:1px 5px; border-radius:6px; cursor:pointer; }
  .ovw header button:hover { color:var(--bad); }
  body.locked .ovw header { display:none; }   /* locked = pure overlay: nothing on a card but its numbers */
  .big { font-size:20px; font-weight:800; line-height:1.15; color:var(--accent); text-shadow:0 1px 2px rgba(0,0,0,.35); }
  .big small { font-size:11px; font-weight:600; color:var(--muted); text-shadow:none; }
  .mapname { font-size:16px; font-weight:700; color:var(--warn); line-height:1.2; overflow-wrap:anywhere; text-shadow:0 1px 2px rgba(0,0,0,.35); }
  .sub { font-size:11px; color:var(--muted); margin-top:1px; }
  .sect { font-size:10px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin:7px 0 2px; }
  .rows { margin-top:4px; display:grid; gap:1px 12px; grid-template-columns:auto auto; justify-content:start; }
  .rows > div { display:flex; gap:7px; align-items:baseline; }
  .rows span { font-size:11px; color:var(--muted); }
  .rows b { font-weight:700; }
  .mrow { display:flex; justify-content:space-between; gap:12px; padding:1.5px 0; }
  .mrow b { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mrow span { color:var(--muted); white-space:nowrap; }
  .lr { padding:1px 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lr time { color:var(--muted); margin-right:6px; }
  .lr.exp span { color:var(--leaf); } .lr.meso span { color:var(--warn); } .lr.loot span { color:var(--ink); }
  .lr.level span, .lr.kpq span, .lr.run span { color:var(--accent); } .lr.death span, .lr.bad span { color:var(--bad); }
  .lr.map, .lr.sep, .lr.msg { color:var(--muted); font-style:italic; }
  .pos { color:var(--leaf); } .neg { color:var(--bad); } .dim { color:var(--muted); }
  .empty { color:var(--muted); font-size:12px; padding:2px 0; }
  .lvbar { display:grid; grid-template-columns:auto minmax(60px, 130px) auto; gap:7px; align-items:center; margin-top:6px; font-weight:700; font-size:11px; color:var(--muted); }
  .lvbar b { color:var(--warn); }
  .trk { position:relative; height:8px; border-radius:4px; background:color-mix(in srgb, var(--panel) 55%, transparent); border:1px solid color-mix(in srgb, var(--line) 70%, transparent); }
  .trk i { position:absolute; inset:0 auto 0 0; border-radius:3px; background:var(--leaf); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--muted); margin-right:7px; vertical-align:1px; }
  .dot.ok { background:var(--leaf); } .dot.warn { background:var(--warn); }
  .lico { height:1.2em; width:auto; image-rendering:pixelated; vertical-align:-0.28em; margin-right:4px; }
  /* edit-mode toolbar: pick what to track, then Done locks the overlay (clicks go through to the game again) */
  #ovbar { position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:9; display:flex; flex-wrap:wrap; align-items:center; gap:2px 10px;
    max-width:min(94vw, 780px); padding:8px 14px; border-radius:12px; background:color-mix(in srgb, var(--panel) 94%, transparent);
    -webkit-backdrop-filter:blur(16px) saturate(1.2); backdrop-filter:blur(16px) saturate(1.2);
    border:1px solid var(--line); box-shadow:0 1px 2px rgba(0,0,0,.22), 0 12px 32px -12px rgba(0,0,0,.45); }
  #ovbar.hidden { display:none; }
  #ovbar b { font-size:12px; color:var(--accent); margin-right:2px; }
  #ovbar .hint { flex-basis:100%; font-size:11px; color:var(--muted); margin:0 0 2px; }
  #ovbar label { display:inline-flex; gap:5px; align-items:center; font-size:12px; padding:2px 0; cursor:pointer; white-space:nowrap; }
  #ovbar label input { accent-color:var(--accent); margin:0; }
  #ovbar button { background:var(--accent); color:var(--on-accent); border:0; border-radius:8px; padding:4px 12px; font:inherit; font-size:12px; font-weight:600; cursor:pointer; }
  #ovbar button.alt { background:var(--accent-soft); color:var(--ink); }
</style>
</head>
<body>
  <div id="ovbar" class="hidden"></div>
  <div id="ovroot"></div>
  <script src="themes.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
